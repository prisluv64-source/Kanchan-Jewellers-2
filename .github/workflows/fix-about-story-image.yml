name: Fix About story image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-about-story-image.yml'
      - 'scripts/fix_about_story_image.py'

permissions:
  contents: write

jobs:
  fix-about-story-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix About story image
        run: python scripts/fix_about_story_image.py

      - name: Commit image fit fix
        run: |
          if git diff --quiet -- about-page.css; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about-page.css
          git commit -m "Show full About story image"
          git pull --rebase origin main
          git push
