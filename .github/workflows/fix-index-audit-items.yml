name: Fix index audit items

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-index-audit-items.yml'
      - 'scripts/fix_index_audit_items.py'

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply fixes
        run: python scripts/fix_index_audit_items.py

      - name: Commit index fixes
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix index performance accessibility and links"
          git push
