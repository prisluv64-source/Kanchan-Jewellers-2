name: Link dedicated contact page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-contact-page.yml'
      - 'scripts/link_contact_page.py'

permissions:
  contents: write

jobs:
  link-contact-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update homepage Visit Us links
        run: python scripts/link_contact_page.py

      - name: Commit contact page links
        run: |
          if git diff --quiet -- index.html; then
            echo "No link changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link Visit Us to dedicated contact page"
          git pull --rebase origin main
          git push
