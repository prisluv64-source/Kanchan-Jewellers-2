name: Apply carousel hotspots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-carousel-hotspots.yml'
      - 'scripts/apply_carousel_hotspots.py'

permissions:
  contents: write

jobs:
  apply-hotspots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply carousel hotspots
        run: python scripts/apply_carousel_hotspots.py

      - name: Commit hotspot integration
        run: |
          if git diff --quiet -- index.html styles.css; then
            echo "Hotspots already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Make carousel image buttons clickable"
          git push
