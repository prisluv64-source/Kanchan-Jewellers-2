name: Link top address

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-top-address.yml'
      - 'scripts/link_top_address.py'

permissions:
  contents: write

jobs:
  link-address:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Link address
        run: python scripts/link_top_address.py

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link top address to Google Maps"
          git push
