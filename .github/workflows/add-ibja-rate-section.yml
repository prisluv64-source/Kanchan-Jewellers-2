name: Add IBJA rate section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-ibja-rate-section.yml'
      - 'scripts/add_ibja_rate_section.py'

permissions:
  contents: write

jobs:
  add-rate-section:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add IBJA rate section and styles
        run: python scripts/add_ibja_rate_section.py

      - name: Commit section
        run: |
          if git diff --quiet -- index.html styles.css; then
            echo "No section changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Add IBJA gold and silver rate section"
          git push
