name: Apply single-line desktop navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-nav-single-line.yml'

permissions:
  contents: write

jobs:
  patch-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply desktop nav fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* ===== SINGLE-LINE LEFT-ALIGNED DESKTOP NAV ===== */'
          if marker not in css:
              css += r'''

/* ===== SINGLE-LINE LEFT-ALIGNED DESKTOP NAV ===== */
@media (min-width: 769px) {
  .main-nav {
    max-width: none !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 6px 12px !important;
    gap: 0 !important;
    flex-wrap: nowrap !important;
    justify-content: flex-start !important;
    align-items: center !important;
    font-size: 0.82rem !important;
    white-space: nowrap !important;
  }

  .main-nav > a,
  .main-nav > .nav-item {
    flex: 0 0 auto !important;
    white-space: nowrap !important;
    margin-right: 25px !important;
  }

  .main-nav > a:last-child,
  .main-nav > .nav-item:last-child {
    margin-right: 0 !important;
  }

  .main-nav .nav-link,
  .main-nav .nav-direct {
    white-space: nowrap !important;
  }
}
'''
              path.write_text(css, encoding='utf-8')
          PY

      - name: Commit navigation fix
        shell: bash
        run: |
          if git diff --quiet -- styles.css; then
            echo "Navigation fix already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Keep desktop navigation on one line from left edge"
          git push
