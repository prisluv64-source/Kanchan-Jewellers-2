name: Update IBJA jewellery rates

on:
  schedule:
    # IBJA publishes opening (AM) and closing (PM) benchmark rates.
    # 06:30 UTC = 12:00 PM IST, 13:30 UTC = 7:00 PM IST
    - cron: '30 6 * * 1-5'
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_rates.py'

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch IBJA rates and update website
        run: python scripts/update_rates.py

      - name: Commit updated rates
        run: |
          if git diff --quiet -- index.html; then
            echo "IBJA rates unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update IBJA jewellery rates"
          git push
