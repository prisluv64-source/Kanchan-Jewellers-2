name: Link Our Story page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-about-page.yml'
      - 'scripts/link_about_page.py'

permissions:
  contents: write

jobs:
  link-about-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Link Our Story page
        run: python scripts/link_about_page.py

      - name: Commit link updates
        run: |
          if git diff --quiet -- index.html contact.html; then
            echo "No link changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html contact.html
          git commit -m "Link Our Story to dedicated page"
          git pull --rebase origin main
          git push
