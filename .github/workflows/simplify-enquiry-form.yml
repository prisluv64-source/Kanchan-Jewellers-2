name: Simplify enquiry form

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-enquiry-form.yml'
      - 'scripts/simplify_enquiry_form.py'

permissions:
  contents: write

jobs:
  simplify-enquiry-form:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Simplify enquiry form
        run: python scripts/simplify_enquiry_form.py

      - name: Commit simplified form
        run: |
          if git diff --quiet -- contact.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact.html
          git commit -m "Make enquiry form open WhatsApp"
          git pull --rebase origin main
          git push
