name: Restore carousel CSS

on:
  push:
    paths:
      - '.github/workflows/restore-carousel-css.yml'
      - 'scripts/restore_carousel_css.py'

permissions:
  contents: write

jobs:
  restore-carousel-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore carousel styling
        run: python scripts/restore_carousel_css.py

      - name: Commit restored carousel styling
        run: |
          if git diff --quiet -- styles.css; then
            echo "Carousel CSS already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Restore carousel styling for UHD banners"
          git push
