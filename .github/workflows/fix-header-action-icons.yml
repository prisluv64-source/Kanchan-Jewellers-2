name: Fix header action icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-header-action-icons.yml'
      - 'scripts/fix_header_action_icons.py'

permissions:
  contents: write

jobs:
  fix-icons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore header icons
        run: python scripts/fix_header_action_icons.py

      - name: Commit header icon fix
        run: |
          if git diff --quiet -- index.html styles.css; then
            echo "No icon changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Restore header action icons"
          git push
