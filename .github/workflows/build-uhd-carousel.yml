name: Build UHD carousel banners

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-uhd-carousel.yml'
      - 'scripts/build_uhd_carousel.py'

permissions:
  contents: write

jobs:
  build-banners:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: pip install pillow requests

      - name: Build 2560px carousel banners
        run: python scripts/build_uhd_carousel.py

      - name: Commit UHD banners
        run: |
          if git diff --quiet -- carousel; then
            echo "Banner files unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carousel/banner-1.webp carousel/banner-2.webp carousel/banner-3.webp carousel/banner-4.webp carousel/banner-5.webp
          git commit -m "Replace carousel banners with UHD versions"
          git push
