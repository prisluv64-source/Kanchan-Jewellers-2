name: Apply earrings mega menu visual fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-mega-menu-visual-fix.yml

permissions:
  contents: write

jobs:
  patch-styles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply visual fix
        run: python scripts/apply_mega_menu_visual_fix.py

      - name: Commit fix
        run: |
          if git diff --quiet -- styles.css; then
            echo "Visual fix already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Match earrings mega menu to full-width reference layout"
          git push
