name: Apply earrings mega menu visual fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mega-menu-visual-fix.yml'

permissions:
  contents: write

jobs:
  patch-styles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply visual fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* ===== FULL-WIDTH EARRINGS MEGA MENU VISUAL FIX ===== */'
          if marker not in css:
              css += r'''

/* ===== FULL-WIDTH EARRINGS MEGA MENU VISUAL FIX ===== */
@media (min-width: 769px) {
  .site-header {
    overflow: visible !important;
  }

  .main-nav {
    position: static !important;
    overflow: visible !important;
  }

  .main-nav .mega-dropdown {
    position: static !important;
  }

  .main-nav .mega-dropdown > .earrings-mega-menu {
    position: absolute !important;
    top: 100% !important;
    left: 0 !important;
    right: 0 !important;
    width: 100vw !important;
    max-width: none !important;
    min-width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    transform: translateY(8px) !important;
    border-radius: 0 !important;
    border-left: 0 !important;
    border-right: 0 !important;
    border-color: rgba(193, 151, 63, 0.20) !important;
    background: #101010 !important;
    box-shadow: 0 18px 35px rgba(0, 0, 0, 0.34) !important;
    overflow: visible !important;
    z-index: 1000 !important;
  }

  .main-nav .mega-dropdown:hover > .earrings-mega-menu,
  .main-nav .mega-dropdown:focus-within > .earrings-mega-menu,
  .main-nav .mega-dropdown.open > .earrings-mega-menu {
    transform: translateY(0) !important;
  }

  .main-nav .earrings-mega-menu::before {
    display: none !important;
  }

  .earrings-mega-menu .category-section {
    width: 100% !important;
    background: #101010 !important;
  }

  .earrings-mega-menu .category-container {
    width: 100% !important;
    max-width: 1280px !important;
    margin: 0 auto !important;
    padding: 30px 32px 28px !important;
    display: grid !important;
    grid-template-columns: minmax(220px, 0.9fr) minmax(330px, 1.35fr) minmax(240px, 0.9fr) !important;
    gap: 54px !important;
    align-items: start !important;
  }

  .earrings-mega-menu .section-title {
    margin: 0 0 14px !important;
    color: #cda8de !important;
    font-family: 'Inter', system-ui, sans-serif !important;
    font-size: 0.76rem !important;
    font-weight: 700 !important;
    letter-spacing: 1.2px !important;
  }

  .earrings-mega-menu .shop-by-occasion ul {
    display: grid !important;
    gap: 1px !important;
    list-style: none !important;
  }

  .earrings-mega-menu .shop-by-occasion a {
    display: block !important;
    padding: 7px 0 !important;
    color: #b9b9b9 !important;
    font-size: 0.88rem !important;
    background: transparent !important;
    border-radius: 0 !important;
  }

  .earrings-mega-menu .shop-by-occasion a:hover {
    color: #ffffff !important;
    background: transparent !important;
  }

  .earrings-mega-menu .popular-items {
    display: grid !important;
    grid-template-columns: 1fr !important;
    gap: 5px !important;
    align-content: start !important;
  }

  .earrings-mega-menu .popular-items .section-title {
    grid-column: 1 !important;
  }

  .earrings-mega-menu .popular-item {
    display: grid !important;
    grid-template-columns: 42px 1fr !important;
    gap: 11px !important;
    align-items: center !important;
    min-height: 50px !important;
    padding: 4px 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
  }

  .earrings-mega-menu .popular-item img {
    width: 42px !important;
    height: 42px !important;
    object-fit: cover !important;
    border-radius: 8px !important;
    border: 1px solid rgba(193, 151, 63, 0.28) !important;
  }

  .earrings-mega-menu .popular-item h4 {
    margin: 0 !important;
    color: #ededed !important;
    font-family: 'Inter', system-ui, sans-serif !important;
    font-size: 0.88rem !important;
    font-weight: 600 !important;
    line-height: 1.2 !important;
  }

  .earrings-mega-menu .popular-item span {
    display: block !important;
    margin-top: 2px !important;
    color: #8f8f8f !important;
    font-size: 0.70rem !important;
  }

  .earrings-mega-menu .featured-product {
    width: 240px !important;
    max-width: 100% !important;
    justify-self: end !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 12px !important;
  }

  .earrings-mega-menu .featured-product img {
    width: 240px !important;
    max-width: 100% !important;
    height: 218px !important;
    object-fit: cover !important;
    border-radius: 14px !important;
  }

  .earrings-mega-menu .view-all-btn {
    width: 100% !important;
    padding: 10px 12px !important;
    border: 1px solid #9670aa !important;
    border-radius: 12px !important;
    background: #5a3470 !important;
    color: #ffffff !important;
    text-align: center !important;
    font-size: 0.78rem !important;
    font-weight: 700 !important;
  }

  .earrings-mega-menu .view-all-btn:hover {
    background: #6c4084 !important;
    color: #ffffff !important;
  }
}
'''
              path.write_text(css, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- styles.css; then
            echo "Visual fix already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Match earrings mega menu to full-width reference layout"
          git push
